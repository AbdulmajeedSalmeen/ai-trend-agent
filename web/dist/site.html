:root {
  --ink: #15172b;
  --ink-soft: #4a5069;
  --ink-faint: #6a7082;
  --paper: #f4f5f7;
  --surface: #ffffff;
  --line: rgba(21, 23, 43, .10);
  --line-soft: rgba(21, 23, 43, .05);
  --gray-soft: #eceef1;
  --neutral-mark: #d8dbe1;

  --good: #1a7f47;
  --info: #1f6fb2;
  --warn: #8a7c0f;
  --crit: #bd2b52;
  --good-soft: #e7f2ec;
  --info-soft: #e8f0f7;
  --warn-soft: #f3f1e2;
  --crit-soft: #fbeaef;
  --good-ink: #145f39;
  --info-ink: #19598f;
  --warn-ink: #635a07;
  --crit-ink: #9c2244;
  --good-edge: rgba(26, 127, 71, .26);
  --warn-edge: rgba(138, 124, 15, .26);
  --ink-edge: rgba(21, 23, 43, .2);
  --good-wash: #f2f8f5;
  --warn-wash: #f9f8f0;

  --r-mark: 4px;
  --r-chip: 8px;
  --r-card: 14px;
  --r-pill: 999px;
  --radius: var(--r-card);

  --shadow-1: 0 1px 1px rgba(21, 23, 43, .035), 0 2px 6px -2px rgba(21, 23, 43, .05);
  --shadow-2: 0 1px 1px rgba(21, 23, 43, .05), 0 14px 32px -16px rgba(21, 23, 43, .18);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-in-out: cubic-bezier(.77, 0, .175, 1);
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.6 var(--sans); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body[dir="rtl"] { font-family: var(--ar); font-weight: 400; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px 88px; }
a { color: var(--info-ink); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: var(--r-mark); }

header { background: var(--surface); position: relative; overflow: hidden; }
header::after {
  content: ""; position: absolute; inset-inline-end: -30px; top: -34px;
  width: 360px; height: 210px; opacity: .4; pointer-events: none;
  background-image: radial-gradient(var(--ink-faint) 1.5px, transparent 1.6px);
  background-size: 14px 14px;
  -webkit-mask-image: radial-gradient(130% 120% at 100% 0, #000 6%, transparent 64%);
  mask-image: radial-gradient(130% 120% at 100% 0, #000 6%, transparent 64%);
}
body[dir="rtl"] header::after {
  -webkit-mask-image: radial-gradient(130% 120% at 0 0, #000 6%, transparent 64%);
  mask-image: radial-gradient(130% 120% at 0 0, #000 6%, transparent 64%);
}
.head-inner { max-width: 1060px; margin: 0 auto; padding: 24px 22px 0; position: relative; z-index: 1; }
.brandline { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mark { display: flex; gap: 3px; align-items: flex-end; height: 24px; }
.mark i { display: block; width: 4px; border-radius: var(--r-mark); }
.mark i:nth-child(1) { height: 11px; background: var(--info); }
.mark i:nth-child(2) { height: 18px; background: var(--info); }
.mark i:nth-child(3) { height: 24px; background: var(--good); }
h1 { font: 700 18px/1 var(--sans); letter-spacing: -.015em; margin: 0; }
body[dir="rtl"] h1 { font-family: var(--ar); font-weight: 600; }
.runid { font: 500 11.5px/1 var(--mono); color: var(--ink-faint); background: var(--gray-soft); padding: 7px 10px; border-radius: var(--r-chip); }
.spacer { flex: 1; }
.lang { border: 1px solid var(--line); border-radius: var(--r-pill); padding: 4px; display: inline-flex; gap: 2px; background: var(--surface); }
.lang button {
  border: 0; background: transparent; color: var(--ink-faint); cursor: pointer;
  font: 600 11.5px/1 var(--sans); padding: 7px 13px; border-radius: var(--r-pill);
  transition: background-color 150ms ease, color 150ms ease;
}
.lang button:hover { color: var(--ink); }
.lang button:active { transform: scale(.96); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.headline {
  margin: 30px 0 6px; font: 700 clamp(25px, 3.5vw, 37px)/1.18 var(--sans);
  letter-spacing: -.028em; max-width: 30ch;
}
body[dir="rtl"] .headline { font-family: var(--ar); font-weight: 600; letter-spacing: 0; line-height: 1.35; max-width: 32ch; }
.headline b { font-weight: inherit; color: var(--good-ink); }
.headline .warn { color: var(--warn-ink); }
.sub { color: var(--ink-soft); margin: 0 0 26px; max-width: 58ch; font-size: 14px; }
.tabbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(252, 252, 253, .84); backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  border-bottom: 1px solid var(--line);
}
.tabbar-inner { max-width: 1060px; margin: 0 auto; padding: 0 22px; }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  position: relative; border: 0; background: transparent; cursor: pointer; white-space: nowrap;
  font: 600 13px/1 var(--sans); color: var(--ink-faint); padding: 15px 12px;
  transition: color 160ms ease, transform 120ms var(--ease-out);
}
body[dir="rtl"] nav.tabs button { font-family: var(--ar); font-weight: 600; }
nav.tabs button::after {
  content: ""; position: absolute; inset-inline: 10px; bottom: 0; height: 2px;
  background: var(--ink); border-radius: var(--r-mark) var(--r-mark) 0 0;
  transform: scaleX(0); transition: transform 220ms var(--ease-out);
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button:active { transform: translateY(1px); }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"]::after { transform: scaleX(1); }
nav.tabs .count { font: 500 10.5px/1 var(--mono); color: var(--ink-faint); margin-inline-start: 7px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); margin: 30px 0 4px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 17px 18px; border-inline-start: 1px solid var(--line-soft); }
.stat:first-child { border-inline-start: 0; padding-inline-start: 0; }
.stat .n { font: 700 27px/1.05 var(--sans); letter-spacing: -.03em; }
.stat .l { font-size: 12.5px; color: var(--ink-faint); margin-top: 4px; }
.stat.good .n { color: var(--good-ink); }
.stat.gap .n { color: var(--warn-ink); }

.panel { display: none; }
.panel[data-open] { display: block; animation: enter 200ms var(--ease-out) both; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
h2 { font: 600 15px/1.4 var(--sans); color: var(--ink); margin: 32px 0 12px; letter-spacing: -.01em; }
body[dir="rtl"] h2 { font-family: var(--ar); letter-spacing: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 10px; box-shadow: var(--shadow-1);
  transition: box-shadow 200ms var(--ease-out), border-color 200ms var(--ease-out), transform 200ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .card:hover { box-shadow: var(--shadow-2); border-color: rgba(21, 23, 43, .16); transform: translateY(-1px); }
}
.card > summary { list-style: none; cursor: pointer; padding: 17px 44px 17px 19px; display: grid; gap: 5px; position: relative; }
body[dir="rtl"] .card > summary { padding: 17px 19px 17px 44px; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary::after {
  content: ""; position: absolute; inset-inline-end: 20px; top: 24px;
  width: 7px; height: 7px; border-right: 1.6px solid var(--ink-faint); border-bottom: 1.6px solid var(--ink-faint);
  transform: rotate(45deg); transition: transform 220ms var(--ease-out), border-color 160ms ease;
}
.card[open] > summary::after { transform: rotate(-135deg); border-color: var(--good); }
.card[open] > summary { border-bottom: 1px solid var(--line-soft); }
.card[open] .body { animation: enter 220ms var(--ease-out) both; }
.card summary { transition: transform 140ms var(--ease-out); }
.card summary:active { transform: scale(.995); }
.row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.subject { font: 500 15px/1.3 var(--mono); letter-spacing: -.02em; }
.chip { font: 600 10.5px/1 var(--sans); padding: 6px 10px; border-radius: var(--r-pill); white-space: nowrap; }
body[dir="rtl"] .chip { font-family: var(--ar); font-weight: 600; font-size: 11px; }
.chip.update { background: var(--good-soft); color: var(--good-ink); }
.chip.add { background: var(--warn-soft); color: var(--warn-ink); }
.chip.watch { background: var(--gray-soft); color: var(--ink-soft); }
.chip.chapter { background: var(--gray-soft); color: var(--ink-soft); font-family: var(--mono); font-weight: 500; }
.chip.gap { background: var(--warn-soft); color: var(--warn-ink); }
.meta { display: flex; gap: 15px; flex-wrap: wrap; color: var(--ink-faint); font-size: 12.5px; align-items: center; }
.meta b { color: var(--ink-soft); font-weight: 600; }
body[dir="rtl"] .meta b { font-weight: 600; }
.reason { color: var(--ink-soft); font-size: 13px; margin: 2px 0 14px; padding-inline-start: 11px; border-inline-start: 1px solid var(--line); }
.bar { height: 3px; background: var(--line-soft); border-radius: var(--r-pill); overflow: hidden; width: 84px; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: var(--r-pill); transform-origin: left center; animation: grow 240ms var(--ease-out) both; }

let lang = "en";
try { lang = localStorage.getItem("ata_lang") || "en"; } catch (e) {}
let actFilter = "all";
let evFilter = "all";

const t = (k) => T[lang][k] || k;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const actionClass = (a) => a === "update_existing_material" ? "update" : a === "add_new_lesson" ? "add" : "watch";

function renderStats() {
  const c = DATA.counts;
  const cards = [
    { n: c.signals, l: t("s_signals") },
    { n: c.trends, l: t("s_trends") },
    { n: c.update, l: t("s_update"), cls: "good" },
    { n: c.new_lesson, l: t("s_gaps"), cls: "gap" },
    { n: c.claims, l: t("s_claims") }
  ];
  document.getElementById("stats").innerHTML = cards.map((s) =>
    `<div class="stat ${s.cls || ""}"><div class="n">${s.n}</div><div class="l">${esc(s.l)}</div></div>`).join("");
}

function claimsTable(item) {
  const rows = item.claims.map((c) => {
    const kind = c.verdict === "confirmed" ? t(c.kind || "primary_report") : t("no_evidence");
    const evidence = c.evidence_url
      ? `<a href="${esc(c.evidence_url)}" target="_blank" rel="noopener">${esc(t("open_evidence"))}</a>`
      : "—";
    const origin = c.origin_title
      ? `<div class="origin">${esc(t("read_from"))}: ${c.origin_url ? `<a href="${esc(c.origin_url)}" target="_blank" rel="noopener">${esc(c.origin_title.slice(0, 64))}</a>` : esc(c.origin_title.slice(0, 64))}</div>`
      : "";
    return `<tr>
      <td><span class="verdict"><span class="dot ${c.verdict}"></span>${esc(t(c.verdict))}</span><div class="kind">${esc(kind)}</div></td>
      <td><div class="claimtext">${esc(c.text)}</div>${origin}</td>
      <td class="ver">${esc(c.version || "—")}</td>
      <td>${evidence}</td>
    </tr>`;
  }).join("");
  return `<table class="claims"><thead><tr>
      <th>${esc(t("th_verdict"))}</th><th>${esc(t("th_claim"))}</th><th>${esc(t("th_version"))}</th><th>${esc(t("th_evidence"))}</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

function groupFamilies(items) {
  const map = new Map();
  items.forEach((i) => {
    if (!map.has(i.family)) map.set(i.family, []);
    map.get(i.family).push(i);
  });
  return [...map.values()]
    .map((members) => {
      members.sort((a, b) => b.priority - a.priority);
      const lead = members[0];
      return {
        family: members.length > 1 ? lead.family : lead.subject,
        lead,
        members,
        confirmed: members.reduce((n, m) => n + m.confirmed, 0),
        unverified: members.reduce((n, m) => n + m.unverified, 0),
        signals: members.reduce((n, m) => n + m.signal_count, 0)
      };
    })
    .sort((a, b) => b.lead.priority - a.lead.priority);
}

function gapLine(item) {
  if (!item.latest_version) return "";
  const kind = item.gap_kind || "unknown";
  const known = item.chapter_version !== null && item.chapter_version !== undefined;
  const move = kind === "unpinned"
    ? `<span class="vpair"><span dir="ltr">${esc(item.latest_version)}</span> &middot; ${esc(t("g_unpinned"))}</span>`
    : known
      ? `<span class="vpair" dir="ltr">${esc(item.chapter_version)} &rarr; ${esc(item.latest_version)}</span>`
      : `<span class="vpair unknown">${esc(t("g_unrecorded"))} &middot; <span dir="ltr">${esc(item.latest_version)}</span></span>`;
  const since = item.releases_since
    ? `<span class="vsince"><b>${item.releases_since}</b> ${esc(t("g_since"))}</span>` : "";
  const legacy = (item.legacy_uses || []).length
    ? `<div class="legacyline">${esc(t("g_legacy"))} ${item.legacy_uses.map((x) =>
        `<code>${esc(x)}</code>`).join(" ")}</div>` : "";
  const label = kind === "unpinned" ? "" : `<span class="vkind">${esc(t("gk_" + kind))}</span>`;
  return `<div class="gapline" data-kind="${esc(kind)}">${move}${label}${since}</div>${legacy}`;
}

function memberBlock(item, showName) {
  const name = showName
    ? `<div class="member"><span class="subject">${esc(item.subject)}</span>
       <span class="chip ${actionClass(item.action)}">${esc(t(item.action))}</span>
       <span class="mprio">${esc(t("priority"))} ${item.priority.toFixed(2)}</span></div>`
    : "";
  return `${name}${gapLine(item)}<p class="reason">${esc(item.rationale)}</p>${claimsTable(item)}`;
}

function renderAct() {
  const filters = [["all", "f_all"], ["update_existing_material", "f_update"], ["add_new_lesson", "f_add"], ["watch", "f_watch"]];
  document.getElementById("actFilters").innerHTML = filters.map(([v, k]) =>
    `<button type="button" data-act="${v}" aria-pressed="${actFilter === v}">${esc(t(k))}</button>`).join("");

  const items = DATA.items.filter((i) => actFilter === "all" || i.action === actFilter);
  const groups = groupFamilies(items);

  document.getElementById("actList").innerHTML = groups.length ? groups.map((g) => {
    const lead = g.lead;
    const chapter = lead.chapter_id
      ? `<span class="chip chapter">${esc(lead.chapter_id)}</span>`
      : `<span class="chip gap">${esc(t("gap"))}</span>`;
    const extra = g.members.length > 1
      ? `<span class="chip pkgs">${g.members.length} ${esc(t("packages"))}</span>` : "";
    return `<details class="card">
      <summary>
        <div class="row1">
          <span class="chip ${actionClass(lead.action)}">${esc(t(lead.action))}</span>
          <span class="subject">${esc(g.family)}</span>
          ${chapter}${extra}
        </div>
        <div class="meta">
          <span>${esc(t("priority"))} <b>${lead.priority.toFixed(2)}</b></span>
          <span class="bar" aria-hidden="true"><i style="width:${Math.min(100, lead.priority / 5 * 100)}%"></i></span>
          <span>${esc(t("confidence"))} <b>${lead.confidence.toFixed(2)}</b></span>
          <span><b>${g.confirmed}</b> ${esc(t("confirmed"))} · <b>${g.unverified}</b> ${esc(t("unverified"))}</span>
          <span><b>${g.signals}</b> ${esc(t("signals"))}</span>
        </div>
      </summary>
      <div class="body">${g.members.map((m) => memberBlock(m, g.members.length > 1)).join("")}</div>
    </details>`;
  }).join("") : `<p class="empty"><strong>${esc(t("empty_t"))}</strong><span>${esc(t("empty_b"))}</span></p>`;
}

function renderMap() {
  const byChapter = {};
  DATA.items.forEach((i) => {
    if (!i.chapter_id) return;
    (byChapter[i.chapter_id] = byChapter[i.chapter_id] || []).push(i);
  });

  let html = "";
  let week = null;
  DATA.chapters.forEach((ch) => {
    if (ch.week !== week) {
      week = ch.week;
      html += `<div class="weekhead">${lang === "ar" ? "الأسبوع" : "Week"} ${week}</div>`;
    }
    const touched = byChapter[ch.chapter_id] || [];
    const tools = ch.tools.length ? `<div class="tools">${ch.tools.map((x) => `<span class="tool">${esc(x)}</span>`).join("")}</div>` : "";
    const teaches = ch.teaches ? `<p class="teaches">${esc(ch.teaches)}</p>` : "";
    const pinned = Object.entries(ch.pins || {});
    const pins = pinned.length
      ? `<div class="pins"><span class="pinlabel">${esc(t("g_pinned"))}</span>${pinned.map(([pkg, v]) =>
          `<span class="pin ${v ? "" : "empty"}">${esc(pkg)} <b dir="ltr">${v ? esc(v) : esc(t("g_unset"))}</b></span>`).join("")}</div>`
      : "";
    const loose = (ch.unpinned || []).filter((x) => DATA.items.some((i) => i.subject === x));
    const unbound = loose.length
      ? `<div class="pins"><span class="pinlabel">${esc(t("g_unpinned"))}</span>${loose.map((x) =>
          `<span class="pin loose">${esc(x)}</span>`).join("")}</div>`
      : "";
    const legacy = (ch.legacy_api || []).length
      ? `<div class="pins"><span class="pinlabel">${esc(t("g_legacy"))}</span>${ch.legacy_api.map((m) =>
          `<span class="pin legacy" title="${esc(m.note)}">${esc(m.uses)}</span>`).join("")}</div>`
      : "";
    const read = ch.notebooks
      ? `<div class="stale">${ch.notebooks} ${esc(t("g_notebooks"))}</div>` : "";
    const list = touched.length
      ? `<div class="touchlist">${touched.map((i) => `<span class="chip ${actionClass(i.action)}">${esc(i.subject)}</span>`).join("")}</div>`
      : `<div class="stale">${esc(t("nothing"))}</div>`;
    const updated = ch.last_updated ? `${esc(t("stale"))} <span dir="ltr">${esc(ch.last_updated)}</span>` : esc(t("never"));
    html += `<div class="chapter ${touched.length ? "touched" : ""}">
        <div class="ctitle"><span class="cid">${esc(ch.chapter_id)}</span><h3>${esc(ch.title)}</h3></div>
        ${teaches}${tools}${pins}${unbound}${legacy}${list}${read}
        <div class="stale">${updated}</div>
      </div>`;
  });

  const gaps = DATA.items.filter((i) => !i.chapter_id);
  if (gaps.length) {
    html += `<div class="weekhead">${lang === "ar" ? "فجوات" : "Gaps"}</div>` + gaps.map((i) =>
      `<div class="chapter gapcard">
        <div class="ctitle"><span class="cid">—</span><h3>${esc(i.subject)}</h3></div>
        <div class="stale">${esc(i.rationale)}</div>
      </div>`).join("");
  }
  document.getElementById("mapList").innerHTML = html;
}

function renderEvidence() {
  const filters = [["all", "v_all"], ["confirmed", "v_confirmed"], ["unverified", "v_unverified"]];
  document.getElementById("evFilters").innerHTML = filters.map(([v, k]) =>
    `<button type="button" data-ev="${v}" aria-pressed="${evFilter === v}">${esc(t(k))}</button>`).join("");

  const items = DATA.items
    .map((i) => ({ ...i, claims: i.claims.filter((c) => evFilter === "all" || c.verdict === evFilter) }))
    .filter((i) => i.claims.length);

  document.getElementById("evList").innerHTML = items.length ? items.map((i) =>
    `<details class="card" open>
      <summary><div class="row1"><span class="subject">${esc(i.subject)}</span>
      ${i.chapter_id ? `<span class="chip chapter">${esc(i.chapter_id)}</span>` : `<span class="chip gap">${esc(t("gap"))}</span>`}
      <span class="meta"><span><b>${i.claims.length}</b> ${esc(t("claims"))}</span></span></div></summary>
      <div class="body">${claimsTable(i)}</div>
    </details>`).join("") : `<p class="empty"><strong>${esc(t("empty_t"))}</strong><span>${esc(t("empty_b"))}</span></p>`;
}

function renderRun() {
  const c = DATA.counts;
  const breakdown = Object.entries(c.sources).map(([k, v]) => `${v} ${k}`).join(" · ");
  const notes = [
    { t: t("n1_t"), b: fill(t("n1_b"), { claims: c.claims, primary: c.kinds.primary_report, cross: c.kinds.cross_source, unv: c.kinds.unverified }) },
    { t: t("n2_t"), b: fill(t("n2_b"), { hn: c.sources.hackernews || 0 }), warn: true },
    { t: t("n3_t"), b: fill(t("n3_b"), { signals: c.signals, breakdown }) },
    { t: t("n4_t"), b: fill(t("n4_b"), { chapters: c.chapters, touched: c.chapters_touched }) }
  ];
  document.getElementById("runNotes").innerHTML = notes.map((n) =>
    `<div class="note ${n.warn ? "warn" : ""}"><h3>${esc(n.t)}</h3><p>${esc(n.b)}</p></div>`).join("") +
    `<div class="note"><dl class="kv">
      <dt>run</dt><dd>${esc(DATA.run_id)}</dd>
      <dt>curriculum</dt><dd>${esc(DATA.curriculum_name)}</dd>
      ${DATA.curriculum_sources.map((s) => `<dt>source</dt><dd>${esc(s)}</dd>`).join("")}
    </dl></div>`;
}


const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const VIZ = {
  get cross() { return token("--good"); }, get primary() { return token("--info"); },
  get unverified() { return token("--warn"); }, get hn() { return token("--info"); },
  get gh() { return token("--good"); }
};

function stacked(parts, total) {
  const segs = parts.filter((p) => p.n > 0).map((p) =>
    `<span style="width:${(p.n / total * 100).toFixed(2)}%;background:${p.color}" title="${esc(p.label)}: ${p.n}"></span>`).join("");
  const legend = parts.map((p) =>
    `<li><span class="sw" style="background:${p.color}"></span>${esc(p.label)} <b class="${p.n ? "" : "zero"}">${p.n}</b></li>`).join("");
  return `<div class="stack" role="img" aria-label="${esc(parts.map((p) => p.label + " " + p.n).join(", "))}">${segs}</div><ul class="legend">${legend}</ul>`;
}

function figure(title, caption, inner) {
  return `<figure class="viz reveal"><figcaption>${esc(title)}</figcaption><div class="cap">${esc(caption)}</div>${inner}</figure>`;
}

function renderActViz() {
  const c = DATA.counts;
  const evidence = stacked([
    { label: t("l_cross"), n: c.kinds.cross_source, color: VIZ.cross },
    { label: t("l_primary"), n: c.kinds.primary_report, color: VIZ.primary },
    { label: t("l_unverified"), n: c.kinds.unverified, color: VIZ.unverified }
  ], Math.max(1, c.claims));
  const src = Object.entries(c.sources);
  const srcTotal = Math.max(1, src.reduce((a, [, v]) => a + v, 0));
  const sources = stacked(src.map(([k, v], i) => ({ label: k, n: v, color: i === 0 ? VIZ.hn : VIZ.gh })), srcTotal);
  document.getElementById("actViz").innerHTML =
    figure(t("viz_ev_t").replace("82", c.claims), t("viz_ev_c"), evidence) +
    figure(t("viz_src_t"), t("viz_src_c"), sources);
}

function majorOf(version) {
  const found = String(version || "").match(/\d+/);
  return found ? Number(found[0]) : null;
}

function renderDistance() {
  const scored = DATA.items
    .filter((i) => i.chapter_id && i.latest_version)
    .map((i) => {
      const course = majorOf(i.chapter_version);
      const latest = majorOf(i.latest_version);
      return { ...i, behind: course === null || latest === null ? null : Math.max(0, latest - course) };
    });

  const measured = scored.filter((r) => r.behind !== null).sort((a, b) => b.behind - a.behind);
  const unbound = scored.filter((r) => r.behind === null).map((r) => r.subject).sort();

  if (!measured.length && !unbound.length) return "";

  const widest = Math.max(1, ...measured.map((r) => r.behind));
  const bars = measured.map((r) => {
    const label = r.behind === 0 ? t("d_same")
      : `${r.behind} ${r.behind === 1 ? t("d_major") : t("d_majors")}`;
    return `<li class="drow">
      <span class="dname">${esc(r.subject)}</span>
      <span class="dspec" dir="ltr">${esc(r.chapter_version)} &rarr; ${esc(r.latest_version)}</span>
      <span class="dtrack"><i style="width:${Math.max(5, (r.behind / widest) * 100).toFixed(1)}%"></i></span>
      <span class="dlabel">${esc(label)}</span>
    </li>`;
  }).join("");

  const loose = unbound.length
    ? `<div class="dloose"><span class="dloose-t">${esc(t("d_nobound"))}</span>
        <div class="dloose-l">${unbound.map((x) => `<span class="pin loose">${esc(x)}</span>`).join("")}</div></div>`
    : "";

  return figure(t("viz_dist_t"), t("viz_dist_c"),
    `${bars ? `<ul class="dlist">${bars}</ul>` : ""}${loose}`);
}

function renderMapViz() {
  const touched = {};
  DATA.items.forEach((i) => { if (i.chapter_id) touched[i.chapter_id] = (touched[i.chapter_id] || 0) + 1; });
  const gaps = DATA.items.filter((i) => !i.chapter_id).length;
  const cells = DATA.chapters.map((ch) => {
    const n = touched[ch.chapter_id] || 0;
    const state = n ? "touched" : "";
    const label = `${ch.chapter_id} · ${ch.title}`;
    const note = n ? `${n} ${t("claims")}` : t("l_quiet");
    return `<span class="cell ${state}" data-tip="${esc(label)}" data-note="${esc(note)}"></span>`;
  }).join("");
  const legend = [
    { label: t("l_touched"), n: Object.keys(touched).length, color: VIZ.cross },
    { label: t("l_quiet"), n: DATA.chapters.length - Object.keys(touched).length, color: "#d9dad3" },
    { label: t("l_gapc"), n: gaps, color: VIZ.unverified }
  ].map((p) => `<li><span class="sw" style="background:${p.color}"></span>${esc(p.label)} <b>${p.n}</b></li>`).join("");
  const gapCells = DATA.items.filter((i) => !i.chapter_id)
    .map((i) => `<span class="cell gap" data-tip="${esc(i.subject)}" data-note="${esc(t("l_gapc"))}"></span>`).join("");
  const outside = gapCells ? `<div class="outside"><span class="outside-l">${esc(t("l_outside"))}</span><div class="strip gapstrip">${gapCells}</div></div>` : "";
  document.getElementById("mapViz").innerHTML =
    renderDistance() +
    figure(t("viz_map_t"), t("viz_map_c"), `<div class="strip">${cells}</div>${outside}<ul class="legend">${legend}</ul>`);
}

const tip = document.getElementById("tip");
document.addEventListener("pointerover", (e) => {
  const cell = e.target.closest(".cell[data-tip]");
  if (!cell) return;
  tip.innerHTML = `<b>${esc(cell.dataset.tip)}</b>${esc(cell.dataset.note)}`;
  const r = cell.getBoundingClientRect();
  tip.setAttribute("data-show", "");
  const w = tip.offsetWidth;
  tip.style.top = `${Math.max(8, r.top - tip.offsetHeight - 10)}px`;
  tip.style.left = `${Math.min(window.innerWidth - w - 10, Math.max(10, r.left + r.width / 2 - w / 2))}px`;
});
document.addEventListener("pointerout", (e) => {
  if (e.target.closest(".cell[data-tip]")) tip.removeAttribute("data-show");
});

let observer = null;
function revealOnScroll() {
  if (observer) observer.disconnect();
  if (!("IntersectionObserver" in window)) {
    document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
    return;
  }
  observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, index) => {
      if (!entry.isIntersecting) return;
      entry.target.style.setProperty("--d", `${Math.min(index * 60, 240)}ms`);
      entry.target.classList.add("in");
      observer.unobserve(entry.target);
    });
  }, { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".reveal:not(.in)").forEach((el) => observer.observe(el));
}



const REASONS = {
  already_running: "e_running", github_budget: "e_budget", locked: "e_locked",
  no_saved_signals: "e_nosignals"
};

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok && response.status !== 409) throw new Error(body.detail || path);
  return body;
}

const STAGE_KEYS = ["ingest", "cluster", "verify", "score", "act"];

function stageResults(log) {
  const text = (log || []).join("\n");
  const out = {};
  const dedupe = text.match(/after dedupe: (\d+)/);
  if (dedupe) out.ingest = `${dedupe[1]} ${t("r_signals")}`;
  const skipped = text.match(/skipped (\d+) clusters/);
  if (skipped) out.cluster = `${skipped[1]} ${t("r_skipped")}`;
  const verdicts = text.match(/(\d+) cross-source, (\d+) primary report, (\d+) unverified/);
  if (verdicts) out.verify = `${verdicts[2]} ${t("r_primary")} · ${verdicts[3]} ${t("r_unverified")}`;
  const recs = text.match(/(\d+) recommendations/);
  if (recs) out.act = `${recs[1]} ${t("r_recs")}`;
  return out;
}

let elapsedTimer = null;
let runStartedAt = 0;
let shownThoughts = 0;

function appendThoughts(thoughts) {
  const box = document.getElementById("thoughts");
  if (!thoughts || !thoughts.length) { if (!shownThoughts) box.innerHTML = ""; return; }
  for (let i = shownThoughts; i < thoughts.length; i += 1) {
    const line = document.createElement("p");
    line.className = "thought";
    line.textContent = thoughts[i];
    box.appendChild(line);
  }
  shownThoughts = thoughts.length;
  while (box.children.length > 6) box.removeChild(box.firstElementChild);
}

function renderTrack(state) {
  const results = stageResults(state.log);
  const done = state.state === "done";
  const stages = state.mode === "replay" ? STAGE_KEYS.slice(1) : STAGE_KEYS;
  document.getElementById("track").innerHTML = stages.map((key, index) => {
    const position = index + 1;
    const nodeState = done || position < state.stage_index ? "done"
      : position === state.stage_index && state.state === "running" ? "active"
      : state.state === "failed" && position === state.stage_index ? "failed" : "pending";
    return `<li class="node" data-state="${nodeState}">
      <span class="pip" aria-hidden="true"></span>
      <span class="nlabel">${esc(t("s_" + key))}</span>
      <span class="nres">${esc(results[key] || "")}</span>
    </li>`;
  }).join("");
}

function setProgress(state) {
  const panel = document.getElementById("runpanel");
  if (!state || state.state === "idle") { panel.hidden = true; return; }

  const wasHidden = panel.hidden;
  panel.hidden = false;
  panel.dataset.state = state.state;
  if (wasHidden) {
    panel.classList.remove("leaving");
    runStartedAt = Date.now();
    shownThoughts = 0;
    document.getElementById("thoughts").innerHTML = "";
  }
  const modelLabel = document.getElementById("runmodel");
  modelLabel.textContent = state.model && state.model !== "no model configured"
    ? `${t("m_reading")} ${state.model}` : t("m_none");
  modelLabel.dataset.off = String(!state.model || state.model === "no model configured");

  document.getElementById("runtitle").textContent = state.state === "running"
    ? (state.mode === "replay" ? t("p_replay") : t("p_live"))
    : state.state === "done" ? t("p_done") : t("p_failed");

  renderTrack(state);
  appendThoughts(state.thoughts);
  document.getElementById("runlog").textContent = (state.log || []).slice(-1)[0] || t("p_waiting");

  clearInterval(elapsedTimer);
  const tick = () => {
    document.getElementById("runtime").textContent =
      `${Math.max(0, Math.round((Date.now() - runStartedAt) / 1000))}${t("p_elapsed")}`;
  };
  tick();
  if (state.state === "running") elapsedTimer = setInterval(tick, 1000);
}

function dismissProgress(delay) {
  setTimeout(() => {
    const panel = document.getElementById("runpanel");
    panel.classList.add("leaving");
    setTimeout(() => { panel.hidden = true; panel.classList.remove("leaving"); }, 340);
  }, delay);
}

function setBusy(busy) {
  document.getElementById("btnRun").disabled = busy;
  document.getElementById("btnReplay").disabled = busy;
  document.getElementById("btnRun").classList.toggle("busy", busy);
}

async function loadRuns(preferred) {
  const { runs } = await api("/api/runs");
  const picker = document.getElementById("runPicker");
  picker.innerHTML = runs.map((r) =>
    `<option value="${esc(r.run_id)}"${r.complete ? "" : " disabled"}>${esc(r.run_id)}${r.complete ? "" : " · partial"}</option>`).join("");
  const target = preferred && runs.some((r) => r.run_id === preferred && r.complete)
    ? preferred
    : (runs.find((r) => r.complete) || {}).run_id;
  if (!target) { document.getElementById("headline").textContent = t("no_runs"); return; }
  picker.value = target;
  await loadRun(target);
}

async function loadRun(runId) {
  DATA = await api(`/api/run/${runId}`);
  const main = document.querySelector("main.wrap");
  main.classList.add("swapping");
  renderAll();
  requestAnimationFrame(() => main.classList.remove("swapping"));
}

let polling = false;
async function pollStatus() {
  if (polling) return;
  polling = true;
  while (true) {
    const state = await api("/api/status");
    setProgress(state);
    if (state.state !== "running") {
      if (state.state === "done") await loadRuns(state.run_id);
      setProgress(state);
      setBusy(false);
      dismissProgress(state.state === "done" ? 5200 : 8000);
      break;
    }
    await new Promise((resolve) => setTimeout(resolve, 900));
  }
  polling = false;
}

async function startRun(replay) {
  setBusy(true);
  const picker = document.getElementById("runPicker");
  const payload = { replay_run_id: replay ? picker.value : null };
  const result = await api("/api/run", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
  });
  if (!result.ok) {
    const key = REASONS[result.reason] || "e_offline";
    setProgress({ state: "failed", mode: replay ? "replay" : "live", log: [t(key)], stage_count: 0, stage_index: 0 });
    setBusy(false);
    dismissProgress(7000);
    return;
  }
  setBusy(true);
  setProgress({ state: "running", mode: result.mode, stage_count: 5, stage_index: 1, log: [] });
  pollStatus();
}

async function boot() {
  document.getElementById("controls").hidden = false;
  document.getElementById("btnRun").addEventListener("click", () => startRun(false));
  document.getElementById("btnReplay").addEventListener("click", () => startRun(true));
  document.getElementById("runPicker").addEventListener("change", (e) => loadRun(e.target.value));
  document.getElementById("headline").textContent = t("loading");
  document.getElementById("actList").innerHTML =
    '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  await loadRuns();
  const state = await api("/api/status");
  if (state.state === "running") { setBusy(true); setProgress(state); pollStatus(); }
}

function applyStrings() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.body.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

function renderAll() {
  if (!DATA) return;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.body.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  const c = DATA.counts;
  document.getElementById("runid").textContent = DATA.run_id;
  document.getElementById("headline").innerHTML = lang === "ar"
    ? `${c.trends} موضوعاً هذا الأسبوع، منها <b>${c.update}</b> تستدعي تحديث فصل، و<span class="warn">${c.new_lesson}</span> أدوات لا يغطيها المنهج.`
    : `${c.trends} subjects this week: <b>${c.update}</b> call for a chapter update and <span class="warn">${c.new_lesson}</span> are not in the curriculum at all.`;
  document.getElementById("c_act").textContent = groupFamilies(DATA.items).length;
  document.getElementById("c_map").textContent = c.chapters;
  document.getElementById("c_ev").textContent = c.claims;
  document.getElementById("foot").textContent = fill(t("foot"), { run: DATA.run_id });

  renderStats(); renderActViz(); renderAct(); renderMapViz(); renderMap(); renderEvidence(); renderRun();
  requestAnimationFrame(revealOnScroll);
}

document.querySelector(".lang").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("ata_lang", lang); } catch (err) {}
  if (DATA) renderAll(); else applyStrings();
});

document.querySelector("nav.tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  document.querySelectorAll("nav.tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  document.querySelectorAll(".panel").forEach((p) => {
    if (p.dataset.panel === b.dataset.tab) p.setAttribute("data-open", ""); else p.removeAttribute("data-open");
  });
  requestAnimationFrame(revealOnScroll);
  const top = document.querySelector("main.wrap").offsetTop - 12;
  if (window.scrollY > top) window.scrollTo({ top, behavior: "smooth" });
});

document.getElementById("actFilters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  actFilter = b.dataset.act;
  renderAct();
  requestAnimationFrame(revealOnScroll);
});

document.getElementById("evFilters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-ev]");
  if (!b) return;
  evFilter = b.dataset.ev;
  renderEvidence();
  requestAnimationFrame(revealOnScroll);
});

if (LIVE) { applyStrings(); boot(); } else { renderAll(); }
</script>
