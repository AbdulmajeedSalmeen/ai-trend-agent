[pytest]
# A warning from our own code is a defect we have not looked at yet, so it fails
# the run. The two below come from starlette's test client and are the library's
# to fix, not ours; they are named exactly so a third one cannot hide behind them.
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    ignore:.*BlockingPortal alias is deprecated.*:DeprecationWarning
